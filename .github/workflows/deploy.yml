name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish every site file. The .ai sources are included on purpose: the
      # lightbox renders them as vectors with the vendored pdf.js.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css light.js lightbox.js .nojekyll Cartoon1.ai Cartoon2.ai Cartoon3.ai _site/
          cp -r previews vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # A separate job: the artifact is registered by the time deploy asks for it.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
