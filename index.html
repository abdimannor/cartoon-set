<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartoon Set</title>
  <meta name="description" content="Three flat vector characters drawn in Adobe Illustrator.">
  <link rel="canonical" href="https://abdimannor.github.io/cartoon-set/">
  <meta property="og:title" content="Cartoon Set">
  <meta property="og:description" content="Three flat vector characters drawn in Adobe Illustrator.">
  <meta property="og:url" content="https://abdimannor.github.io/cartoon-set/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://abdimannor.github.io/cartoon-set/previews/cartoon1.png">
  <meta property="og:image:alt" content="Cartoon 1: smiling man in a red sleeveless top carrying a blue case">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#e9e1d3">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="eyebrow">Vector illustrations</p>
    <h1>Cartoon Set</h1>
    <p class="lead">Three flat vector characters drawn in Adobe Illustrator.</p>
  </header>
  <main>
    <figure class="card">
      <div class="frame"><img src="previews/cartoon1.png" alt="Cartoon 1: smiling man in a red sleeveless top carrying a blue case" width="1131" height="1600" loading="eager" decoding="async"></div>
      <figcaption><span class="num">01</span><h2>Cartoon 1</h2><p>A standing man with dark curly hair and a wide open smile, in a red sleeveless top, black trousers and red shoes, holding a blue case in one hand.</p><code>Cartoon1.ai</code></figcaption>
    </figure>
    <figure class="card">
      <div class="frame"><img src="previews/cartoon2.png" alt="Cartoon 2: smiling man with braided hair in an all-black outfit" width="1131" height="1600" loading="lazy" decoding="async"></div>
      <figcaption><span class="num">02</span><h2>Cartoon 2</h2><p>A standing man with braided hair and the same wide smile, dressed in black from top to shoes, arms at his sides.</p><code>Cartoon2.ai</code></figcaption>
    </figure>
    <figure class="card">
      <div class="frame"><img src="previews/cartoon3.png" alt="Cartoon 3: round red and black robot-like figure with arms spread" width="1131" height="1600" loading="lazy" decoding="async"></div>
      <figcaption><span class="num">03</span><h2>Cartoon 3</h2><p>A rounder, robot-like figure with a black helmet and visor, a red body with a round green lens on the chest, and arms spread wide.</p><code>Cartoon3.ai</code></figcaption>
    </figure>
  </main>
  <footer>
    <p>All three share the same flat style: simple geometric shapes, no outlines, and a small palette of red, black, blue and skin tones on a white page.</p>
    <p>Source files and license on <a href="https://github.com/abdimannor/cartoon-set">GitHub</a>.</p>
  </footer>
</body>
</html>
